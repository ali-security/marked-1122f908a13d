name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional space-separated spec file selector'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        # upstream's own matrix was ['lts/*', 'node'], resolved here to the
        # versions those labels named at the 2021-05-27 release. Node 8 cannot
        # run the project's pinned jasmine@3.7.0 (its loader.js uses dynamic
        # import(), a SyntaxError before Node 12.17), so engines.node's 8.16.2
        # floor is stale and was never exercised by upstream CI.
        node_version: [14, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      # marked.min.js is uglify output derived from lib/marked.js and is shipped
      # in the tarball, so it has to be regenerated from the patched bundle
      # before the tests read it and before npm pack collects it.
      - name: Minify browser bundle 🗜️
        run: npm run minify
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:unit -- ${{ inputs.test-filter }}
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:specs -- ${{ inputs.test-filter }}
          else
            npm run test:specs
          fi
      - name: Pack tarball 📦
        if: matrix.node_version == 14
        run: |
          npm i -g npm@7.12.0
          npm pack
      - name: Upload tarball
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
